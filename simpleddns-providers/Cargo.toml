[package]
name = "simpleddns-providers"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
simpleddns-core = { path = "../simpleddns-core" }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.22"
hmac-sha1 = "0.2"
urlencoding = "2.1"

