[package]
name = "simpleddns-providers"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
simpleddns-core = { path = "../simpleddns-core" }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
